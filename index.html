<!DOCTYPE html><html lang="ko" class="performance-mode"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PITCH MASTER</title>
<style>
:root{--bg:#0b1220;--bg2:#121c33;--card:#17233f;--line:#2a3a60;--tx:#e8eefc;--mut:#8ea0c8;--ac:#38e08c;--ac2:#4aa3ff;--bad:#ff5d6c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#e9eef8;--bg2:#fff;--card:#fff;--line:#cbd6ee;--tx:#14203b;--mut:#5b6b90}}
:root[data-theme=light]{--bg:#e9eef8;--bg2:#fff;--card:#fff;--line:#cbd6ee;--tx:#14203b;--mut:#5b6b90}
*{box-sizing:border-box;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:radial-gradient(1200px 600px at 70% -10%,#1d3a6e55,transparent),var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;min-height:100%}
#app{max-width:980px;margin:0 auto;padding:12px}
h1{font-size:20px;letter-spacing:2px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;color:transparent}
h2{font-size:13px;color:var(--mut);letter-spacing:1px;margin-bottom:8px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
nav{display:flex;gap:6px;margin-bottom:12px}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--ac2)}button.on{background:linear-gradient(135deg,#1f9d63,#2a7de0);border-color:transparent;color:#fff}
nav button{flex:1}.big{width:100%;padding:14px;font-size:16px;font-weight:700;background:linear-gradient(135deg,#1f9d63,#2a7de0);border:0;color:#fff;box-shadow:0 6px 20px #2a7de044}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 8px 24px #0004}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.g2{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px 4px;text-align:center}th{color:var(--mut);font-weight:500}td:nth-child(2),th:nth-child(2){text-align:left}
tr.me{background:#38e08c22;font-weight:700}tbody tr{border-top:1px solid var(--line)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tc{cursor:pointer;transition:.2s}.tc:hover{transform:translateY(-3px)}.tc b{font-size:16px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.pl{display:grid;grid-template-columns:34px 1fr 36px 96px;gap:6px;align-items:center;padding:6px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.pl:hover{background:#ffffff0a}.pl.xi{background:#38e08c14}.pl.sel{border-color:var(--ac);background:#38e08c33}
.pos{font-size:11px;text-align:center;border-radius:5px;padding:2px;font-weight:700;color:#06121f}
.GK{background:#ffd23f}.DF{background:#4aa3ff}.MF{background:#38e08c}.FW{background:#ff6b7a}
.sb{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:16px;padding:8px 4px}
.sb b{font-size:30px;letter-spacing:3px;background:#000a;color:#fff;padding:2px 16px;border-radius:10px}.sb i{color:var(--ac);font-style:normal}
canvas{width:100%;border-radius:14px;display:block;box-shadow:0 10px 30px #0008}
.ctl{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;align-items:center}
#log{max-height:150px;overflow:auto;font-size:13px}#log div{padding:3px 0;border-bottom:1px solid var(--line)}
.ev{color:var(--ac);font-weight:700}.res{display:flex;justify-content:space-between;padding:3px 0}
#fx{position:fixed;inset:0;z-index:99;pointer-events:none;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}
#fx .fl{position:absolute;inset:0;background:radial-gradient(circle,#fffc,transparent 62%);animation:fl .9s ease-out forwards}
#fx h3{font-size:clamp(56px,17vw,140px);font-weight:900;font-style:italic;color:#fff;letter-spacing:4px;text-shadow:0 0 18px var(--c),0 0 48px var(--c),0 6px 0 #0007;animation:pop 2.8s cubic-bezier(.2,1.5,.4,1) forwards}
#fx p{font-size:clamp(20px,5vw,34px);font-weight:800;color:#fff;text-shadow:0 0 14px var(--c),0 2px 0 #000a;animation:pop 2.8s .1s cubic-bezier(.2,1.5,.4,1) forwards;opacity:0}
#fx .ring{position:absolute;width:40px;height:40px;border:6px solid var(--c);border-radius:50%;animation:ring 1.2s ease-out forwards}
#fx i{position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50%;background:var(--k);box-shadow:0 0 10px var(--k);animation:sp 1.5s ease-out forwards}
#fx b{position:absolute;top:-24px;width:9px;height:16px;animation:cf linear forwards}
@keyframes fl{to{opacity:0}}@keyframes ring{to{transform:scale(45);opacity:0}}
@keyframes pop{0%{transform:scale(.1) rotate(-10deg);opacity:0}14%{transform:scale(1.2) rotate(2deg);opacity:1}24%{transform:scale(1) rotate(0)}85%{opacity:1}100%{transform:scale(1.15);opacity:0}}
@keyframes sp{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
@keyframes cf{to{transform:translateY(115vh) rotate(var(--r))}}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-8px,5px)}40%{transform:translate(7px,-6px)}60%{transform:translate(-5px,-4px)}80%{transform:translate(4px,5px)}}
body.shake{animation:shake .5s}
.f{display:inline-block;width:22px;height:22px;border-radius:6px;text-align:center;line-height:22px;font-size:11px;font-weight:800;color:#06121f;margin-right:3px}.W{background:var(--ac)}.D{background:#ffd23f}.L{background:var(--bad)}.busy{animation:bz .35s infinite alternate}@keyframes bz{to{transform:scale(1.03);box-shadow:0 0 18px var(--ac)}}
/* ===== ADVANCED FX PACK : 기존 디자인 유지형 ===== */
body{overflow-x:hidden;background-image:radial-gradient(900px 500px at 15% 0%,#38e08c12,transparent 60%),radial-gradient(1000px 600px at 90% 10%,#4aa3ff12,transparent 60%),radial-gradient(1200px 600px at 70% -10%,#1d3a6e55,transparent)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:linear-gradient(transparent 50%,#ffffff03 50%);background-size:100% 4px;mix-blend-mode:overlay;opacity:.35}
#app{position:relative;z-index:1}
header h1{filter:drop-shadow(0 0 12px #38e08c33);animation:brandGlow 3s ease-in-out infinite}
@keyframes brandGlow{50%{filter:drop-shadow(0 0 22px #4aa3ff55)}}
.card{position:relative;overflow:hidden;transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}
.card:after{content:"";position:absolute;inset:-1px;pointer-events:none;border-radius:inherit;background:linear-gradient(120deg,transparent 25%,#ffffff10 42%,transparent 60%);transform:translateX(-130%);transition:transform .8s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 12px 34px #0006}
.card:hover:after{transform:translateX(130%)}
button{position:relative;overflow:hidden;transition:transform .12s ease,box-shadow .2s ease,border-color .2s ease}
button:active{transform:scale(.96)}
button:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
.big{position:relative;box-shadow:0 8px 28px #2a7de055,0 0 0 1px #ffffff0b inset;animation:bigBreath 2.4s ease-in-out infinite}
@keyframes bigBreath{50%{box-shadow:0 10px 34px #38e08c33,0 0 18px #4aa3ff18 inset}}
.bar{position:relative}.bar i{position:relative;box-shadow:0 0 12px #38e08c55;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar i:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#fff8,transparent);animation:barShine 1.8s linear infinite}
@keyframes barShine{to{transform:translateX(180%)}}
.pl{transition:transform .18s ease,background .18s ease,border-color .18s ease;position:relative}
.pl:hover{transform:translateX(3px);box-shadow:0 5px 18px #0003}
.pl.sel{animation:selectedPulse 1.2s ease-in-out infinite}
@keyframes selectedPulse{50%{box-shadow:0 0 0 3px #38e08c18,0 0 18px #38e08c18}}
.dot{box-shadow:0 0 8px currentColor}
nav button.on{box-shadow:0 5px 20px #2a7de044}
.teams .tc{will-change:transform}.teams .tc:hover{box-shadow:0 12px 28px #0006,0 0 18px #4aa3ff15}
#meta{transition:opacity .25s ease}
#log div{animation:logIn .25s ease both}
@keyframes logIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
/* 경기 화면 HUD */
.match-hud{position:relative;margin:8px 0;padding:8px 10px;border:1px solid #ffffff12;border-radius:10px;background:#0003;overflow:hidden}
.match-hud:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#38e08c12,transparent);transform:translateX(-100%);animation:hudSweep 2.6s linear infinite}
@keyframes hudSweep{to{transform:translateX(100%)}}
.score-live{animation:scoreLive 1.1s ease-in-out infinite}
@keyframes scoreLive{50%{text-shadow:0 0 18px #38e08c88;transform:scale(1.03)}}
/* 탭 전환 */
main{animation:viewIn .25s ease both}
@keyframes viewIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
/* 강화 진행 */
.upgrade-energy{position:relative;overflow:hidden;border-radius:8px}
.upgrade-energy:after{content:"";position:absolute;top:0;bottom:0;width:35%;background:linear-gradient(90deg,transparent,#fff8,transparent);animation:energySweep .8s linear infinite}
@keyframes energySweep{from{left:-40%}to{left:110%}}
/* 클릭 리플 */
.fx-ripple{position:fixed;width:18px;height:18px;border-radius:50%;border:2px solid #fff8;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);animation:ripple .65s ease-out forwards}
@keyframes ripple{to{width:110px;height:110px;opacity:0;border-width:1px}}
/* 화면 비네팅 */
#app:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:100;box-shadow:inset 0 0 120px #0005}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition:none!important}}
/* ===== 경기 MOM ===== */
.mom-wrap{margin-top:10px;padding:14px;border:1px solid #38e08c55;border-radius:14px;background:radial-gradient(circle at 50% 0%,#38e08c18,transparent 65%),linear-gradient(180deg,#ffffff05,#0002);box-shadow:0 0 24px #38e08c18}
.mom-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;background:linear-gradient(135deg,#ffd23f,#ff9f1c);color:#171000;font-size:11px;font-weight:900;letter-spacing:1px;box-shadow:0 0 18px #ffd23f44}
.mom-name{margin-top:6px;font-size:25px;font-weight:900;background:linear-gradient(90deg,var(--ac),#fff,var(--ac2));-webkit-background-clip:text;color:transparent}
.mom-rating{font-size:34px;font-weight:900;line-height:1;text-shadow:0 0 20px #38e08c66;margin-top:6px}
.mom-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.mom-grid div{padding:7px 4px;border:1px solid var(--line);border-radius:9px;background:#0002;text-align:center}.mom-grid b{display:block;font-size:15px}.mom-grid small{color:var(--mut)}
@media(max-width:520px){.mom-grid{grid-template-columns:repeat(2,1fr)}}
.mom-list{margin-top:8px}.mom-list .res{padding:5px 0}
@keyframes momIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.mom-wrap{animation:momIn .45s ease both}
/* ===== REAL-TIME PLAYER RATINGS ===== */
.rating-live{margin-top:10px;padding:10px;border:1px solid #ffffff12;border-radius:12px;background:#0003;position:relative;overflow:hidden}
.rating-live:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#4aa3ff0d,transparent);transform:translateX(-100%);animation:ratingSweep 2.2s linear infinite}
@keyframes ratingSweep{to{transform:translateX(100%)}}
.rating-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.rating-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:650px){.rating-grid{grid-template-columns:1fr}}
.rating-team{min-width:0}
.rating-team-title{font-size:11px;color:var(--mut);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rating-row{display:grid;grid-template-columns:28px 1fr 38px;gap:5px;align-items:center;padding:4px 5px;border-radius:7px;transition:background .18s ease,transform .18s ease}
.rating-row:hover{background:#ffffff08;transform:translateX(2px)}
.rating-row.motm{background:#ffd23f12;box-shadow:inset 2px 0 #ffd23f}
.rating-pos{font-size:10px;color:var(--mut)}
.rating-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.rating-num{text-align:right;font-weight:900;font-variant-numeric:tabular-nums}
.rating-meter{height:4px;margin-top:2px;background:var(--line);border-radius:3px;overflow:hidden}
.rating-meter i{display:block;height:100%;background:linear-gradient(90deg,#4aa3ff,#38e08c);transition:width .45s ease}
/* ===== CINEMATIC MOM CEREMONY ===== */
#momFx{position:fixed;inset:0;z-index:10000;pointer-events:none;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at center,#ffd23f18,transparent 30%),linear-gradient(180deg,#030713df,#081020f2)}
#momFx .mom-dim{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,transparent 0 16%,#0008 48%,#000d 100%);animation:momDim 4.8s ease both}
@keyframes momDim{0%{opacity:0}12%{opacity:1}80%{opacity:1}100%{opacity:0}}
#momFx .spot{position:absolute;width:min(76vw,680px);height:min(76vw,680px);border-radius:50%;background:conic-gradient(from 0deg,#fff0,#fff7,#ffd23f55,#fff0);filter:blur(2px);opacity:0;animation:spotSpin 4.3s ease-out .15s both}
@keyframes spotSpin{0%{opacity:0;transform:scale(.2) rotate(-35deg)}16%{opacity:.95}60%{opacity:.85;transform:scale(1.1) rotate(40deg)}100%{opacity:0;transform:scale(1.28) rotate(110deg)}}
#momFx .trophy{position:relative;z-index:3;font-size:clamp(78px,16vw,160px);filter:drop-shadow(0 0 16px #ffd23f) drop-shadow(0 0 44px #ffd23f);opacity:0;transform:translateY(40px) scale(.2) rotate(-12deg);animation:trophyIn 1s cubic-bezier(.16,1.4,.3,1) .45s forwards,trophyFloat 1.8s ease-in-out 1.5s 2}
@keyframes trophyIn{0%{opacity:0;transform:translateY(40px) scale(.2) rotate(-12deg)}55%{opacity:1;transform:translateY(-10px) scale(1.15) rotate(4deg)}100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}}
@keyframes trophyFloat{50%{transform:translateY(-9px) scale(1.03)}}
#momFx .mom-copy{position:absolute;z-index:4;top:18%;text-align:center;opacity:0;animation:copyIn .8s ease .9s forwards}
#momFx .mom-kicker{font-size:clamp(18px,3vw,28px);font-weight:900;letter-spacing:7px;color:#ffd23f;text-shadow:0 0 14px #ffd23f}
#momFx .mom-title{font-size:clamp(34px,7vw,72px);font-weight:1000;letter-spacing:5px;color:#fff;text-shadow:0 0 18px #4aa3ff,0 0 44px #ffd23f88}
@keyframes copyIn{from{opacity:0;transform:translateY(-18px);filter:blur(7px)}to{opacity:1;transform:none;filter:none}}
#momFx .mom-reveal{position:absolute;z-index:5;top:57%;text-align:center;opacity:0;transform:translateY(24px) scale(.92);animation:revealIn .9s cubic-bezier(.2,1.2,.25,1) 1.55s forwards}
#momFx .mom-player{font-size:clamp(24px,6vw,58px);font-weight:1000;color:#fff;text-shadow:0 0 14px #38e08c,0 0 35px #4aa3ff88}
#momFx .mom-club{margin-top:3px;color:#c7d7f7;font-size:clamp(12px,2.5vw,18px)}
#momFx .mom-score{margin-top:8px;font-size:clamp(50px,12vw,105px);line-height:.9;font-weight:1000;background:linear-gradient(180deg,#fff,#ffd23f);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 14px #ffd23f88)}
#momFx .mom-label{margin-top:5px;color:#ffd23f;font-weight:900;letter-spacing:3px}
@keyframes revealIn{from{opacity:0;transform:translateY(24px) scale(.92)}to{opacity:1;transform:none}}
#momFx .mom-ring{position:absolute;z-index:2;width:min(65vw,500px);aspect-ratio:1;border:2px solid #ffd23f77;border-radius:50%;box-shadow:0 0 25px #ffd23f44,inset 0 0 25px #ffd23f22;animation:ringPulse 1.4s ease-in-out infinite;opacity:0;animation-delay:1s;animation-fill-mode:forwards}
@keyframes ringPulse{0%{opacity:0;transform:scale(.55)}30%{opacity:.8}70%{opacity:.35;transform:scale(1.12)}100%{opacity:0;transform:scale(1.24)}}
#momFx .conf{position:absolute;top:-22px;width:8px;height:18px;border-radius:2px;animation:momConf linear forwards}
@keyframes momConf{to{transform:translate3d(var(--x),115vh,0) rotate(var(--r));opacity:0}}
#momFx .star{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 10px #ffd23f;animation:starPop 1.8s ease-out forwards}
@keyframes starPop{0%{transform:translate(0,0) scale(.2);opacity:0}18%{opacity:1}100%{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}
@media(prefers-reduced-motion:reduce){#momFx *{animation-duration:.001ms!important;animation-delay:0ms!important}}


/* ===== MASTER PREMIUM UI / 재미 요소 패키지 ===== */
body:after{content:"";position:fixed;inset:-20%;pointer-events:none;z-index:-1;background:conic-gradient(from 90deg at 50% 50%,#38e08c08,transparent 18%,#4aa3ff09,transparent 43%,#a855f708,transparent 68%,#38e08c08);filter:blur(28px);animation:auroraSpin 18s linear infinite}
@keyframes auroraSpin{to{transform:rotate(360deg)}}
header{position:relative;padding:10px 12px;border:1px solid #ffffff10;border-radius:16px;background:linear-gradient(135deg,#ffffff06,#ffffff02);backdrop-filter:blur(10px);overflow:hidden}
header:after{content:"";position:absolute;left:-30%;top:0;width:30%;height:100%;background:linear-gradient(90deg,transparent,#fff2,transparent);transform:skewX(-20deg);animation:headerScan 4.8s ease-in-out infinite}
@keyframes headerScan{55%,100%{left:130%}}
.dashboard-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}@media(max-width:760px){.dashboard-grid{grid-template-columns:1fr}}
.premium-hero{position:relative;min-height:190px;display:grid;grid-template-columns:1.2fr .8fr;gap:12px;align-items:center;overflow:hidden;background:radial-gradient(circle at 15% 20%,#38e08c18,transparent 36%),radial-gradient(circle at 85% 10%,#4aa3ff22,transparent 40%),linear-gradient(135deg,var(--card),var(--bg2));border:1px solid #ffffff18}
@media(max-width:700px){.premium-hero{grid-template-columns:1fr}}
.premium-hero:before{content:"";position:absolute;inset:-80%;background:conic-gradient(from 0deg,transparent,#38e08c12,transparent,#4aa3ff12,transparent);animation:heroOrbit 10s linear infinite}
@keyframes heroOrbit{to{transform:rotate(360deg)}}
.hero-copy,.score-orb{position:relative;z-index:1}
.hero-kicker{font-size:11px;letter-spacing:2px;color:var(--ac);font-weight:800;margin-bottom:7px}
.hero-title{font-size:clamp(24px,5vw,40px);line-height:1.05;font-weight:900;letter-spacing:-1px;background:linear-gradient(90deg,#fff,var(--ac2),var(--ac));-webkit-background-clip:text;color:transparent;text-shadow:0 0 24px #38e08c22}
.hero-sub{color:var(--mut);margin-top:7px}
.hero-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.hero-team{font-size:13px;color:#fff;padding:4px 8px;border-radius:999px;background:#0005;border:1px solid #fff1;display:inline-flex;align-items:center;gap:5px;margin-top:10px}
.score-orb{justify-self:end;width:min(220px,52vw);aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#fff3,transparent 22%),radial-gradient(circle,#1d294a 0 38%,#0a1020 68%,transparent 69%);box-shadow:0 0 0 1px #ffffff18,0 0 45px #4aa3ff28,0 0 110px #38e08c12;animation:orbFloat 4s ease-in-out infinite}
@keyframes orbFloat{50%{transform:translateY(-7px) scale(1.02);box-shadow:0 0 0 1px #ffffff22,0 0 55px #38e08c35,0 0 130px #4aa3ff18}}
.score-orb .orb-inner{text-align:center}.orb-vs{color:var(--mut);font-size:11px;letter-spacing:2px}.orb-teams{font-size:12px;margin:4px 0}.orb-score{font-size:42px;font-weight:900;letter-spacing:3px}.orb-score span{color:var(--ac)}
.premium-card{position:relative;overflow:hidden;border-color:#ffffff15!important;background:linear-gradient(145deg,#ffffff05,var(--card) 35%,var(--bg2));}
.premium-card:before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,#fff10 45%,transparent 65%);transform:translateX(-130%);animation:cardSheen 7s ease-in-out infinite}
@keyframes cardSheen{14%,100%{transform:translateX(130%)}}
.section-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}.section-top h2{margin:0}.section-tag{font-size:10px;padding:4px 7px;border-radius:999px;color:#fff;background:linear-gradient(90deg,#1f9d63,#2a7de0);font-weight:800;letter-spacing:1px}
.mini-stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}@media(max-width:650px){.mini-stat-grid{grid-template-columns:repeat(2,1fr)}}

.radar-card{min-height:178px;display:grid;grid-template-columns:150px 1fr;align-items:center;gap:10px}@media(max-width:650px){.radar-card{grid-template-columns:1fr}}.radar{width:145px;height:145px;border-radius:50%;margin:auto;position:relative;background:repeating-radial-gradient(circle,#fff1 0 1px,transparent 1px 28px),conic-gradient(from 0deg,#38e08c10,#4aa3ff18,#38e08c10);border:1px solid #ffffff18;box-shadow:inset 0 0 30px #0006}.radar:before{content:"";position:absolute;inset:8px;border-radius:50%;border:1px solid #ffffff18;transform:rotate(20deg);clip-path:polygon(50% 50%,100% 0,100% 100%);background:conic-gradient(from 0deg,transparent,#38e08c44,transparent);animation:radarSpin 3.2s linear infinite}.radar:after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:var(--ac);box-shadow:0 0 18px var(--ac);transform:translate(-50%,-50%)}@keyframes radarSpin{to{transform:rotate(380deg)}}

.hot-list .pl{margin:4px 0;background:#0003;border-color:#ffffff07}.hot-list .pl:hover{background:#ffffff0c;box-shadow:0 0 25px #4aa3ff18}

@keyframes shopSpin{to{transform:rotate(360deg)}}
.shop-hero-main>* ,.shop-fp-bank>*{position:relative;z-index:1}
.shop-kicker{font-size:10px;letter-spacing:2.2px;color:#8fe9ff;font-weight:900}
.shop-title{font-size:clamp(24px,4vw,38px);font-weight:900;letter-spacing:-1px;margin-top:5px;background:linear-gradient(90deg,#fff,#9feaff,#67d5ff);-webkit-background-clip:text;color:transparent}
.fp-balance-big{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-radius:14px;background:linear-gradient(145deg,#0b1931,#081225);border:1px solid #4aa3ff3a;box-shadow:0 0 38px #4aa3ff14,inset 0 0 24px #4aa3ff08}

@media(max-width:820px){.pack-grid{grid-template-columns:1fr}}

.pack-card:hover{transform:translateY(-5px);box-shadow:0 18px 48px #0008,0 0 40px #4aa3ff12;border-color:#ffffff24}

.pack-card.premium:after{content:"";position:absolute;inset:-20%;background:conic-gradient(from 0deg,transparent 0 25%,#8de8ff10 30%,transparent 40% 65%,#ffd23f08 70%,transparent 80%);animation:packOrbit 8s linear infinite;pointer-events:none}
@keyframes packOrbit{to{transform:rotate(360deg)}}
.pack-art{height:125px;display:grid;place-items:center;position:relative;z-index:1}
.pack-badge{padding:5px 9px;border-radius:999px;background:#0007;border:1px solid #ffffff1c;color:var(--mut);font-size:10px;letter-spacing:1.5px}
.pack-crystal{width:92px;height:112px;border-radius:18px;transform:rotate(-7deg);background:linear-gradient(145deg,#bff7ff,#3ab7ff 38%,#122853 74%);box-shadow:0 0 0 1px #fff8 inset,0 15px 40px #0009,0 0 45px #4aa3ff55;position:relative}
.pack-crystal:before{content:"💎";position:absolute;inset:0;display:grid;place-items:center;font-size:42px;filter:drop-shadow(0 0 12px #fff8)}

.pack-card.premium .pack-crystal:before{content:"🏆"}
.pack-name{position:relative;z-index:1;font-size:21px;font-weight:900;margin:2px 0 7px}
.pack-sub{position:relative;z-index:1;color:var(--mut);font-size:12px;min-height:40px}
.pack-odds{position:relative;z-index:1;display:flex;gap:6px;flex-wrap:wrap;margin:11px 0}
.pack-pill{padding:4px 7px;border-radius:999px;background:#fff5;border:1px solid #ffffff10;font-size:10px;color:#d6deee}
.pack-pill.hot{color:#ffe693;border-color:#ffd23f44;background:#ffd23f0d}
.pack-cost{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
.pack-cost b{font-size:18px}
.pack-note{font-size:11px;color:var(--mut);margin-top:7px}
.collection-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(max-width:650px){.collection-grid{grid-template-columns:1fr}}
.collection-card{display:grid;grid-template-columns:42px 1fr auto;gap:9px;align-items:center;padding:9px;border:1px solid #ffffff10;border-radius:12px;background:#091120cc}
.collection-avatar{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,#1a3156,#08111f);border:1px solid #ffffff18;font-weight:900}
.collection-name{font-weight:800}.collection-meta{font-size:11px;color:var(--mut)}
#packFx{position:fixed;inset:0;z-index:10020;display:grid;place-items:center;overflow:hidden;pointer-events:auto;background:#020611ee;animation:packFadeIn .45s ease both}
#packFx .pack-vignette{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,transparent 0 22%,#0006 62%,#000d 100%)}
#packFx .beam{position:absolute;left:50%;top:-15%;width:28vw;height:140%;transform-origin:50% 10%;filter:blur(1px);background:linear-gradient(180deg,#fff0,#fff8,#fff0);opacity:.16;animation:beamMove 2.6s ease-in-out infinite}
#packFx .beam.b1{transform:translateX(-50%) rotate(18deg)}
#packFx .beam.b2{transform:translateX(-50%) rotate(-18deg);animation-delay:.15s}
@keyframes packFadeIn{from{opacity:0}to{opacity:1}}
@keyframes beamMove{50%{opacity:.42}}
.pack-stage{position:relative;z-index:3;text-align:center;width:min(900px,92vw);min-height:420px;display:grid;place-items:center}
.pack-stage .step{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transform:translateY(18px) scale(.96);pointer-events:none}
.pack-stage .step.s1{animation:packStep 3.8s ease .1s both}.pack-stage .step.s2{animation:packStep 3.8s ease 1.0s both}.pack-stage .step.s3{animation:packStep 3.8s ease 2.0s both}.pack-stage .step.s4{animation:packStep 3.8s ease 3.0s both}.pack-stage .step.s5{animation:packStepLast 1.4s ease 4.0s both}
@keyframes packStep{0%,10%{opacity:0;transform:translateY(18px) scale(.95)}18%,68%{opacity:1;transform:none}78%,100%{opacity:0;transform:translateY(-12px) scale(1.02)}}
@keyframes packStepLast{0%{opacity:0;transform:scale(.6)}20%,100%{opacity:1;transform:scale(1)}}
.pack-kicker{font-size:12px;letter-spacing:4px;color:#b7c8e8;font-weight:900}
.pack-big{font-size:clamp(30px,7vw,68px);font-weight:950;letter-spacing:-2px;background:linear-gradient(90deg,#fff,#a9ebff,#fff,#ffd86b);-webkit-background-clip:text;color:transparent;text-shadow:0 0 35px #4aa3ff35}
.pack-player{font-size:clamp(32px,7vw,72px);font-weight:950;color:#fff;text-shadow:0 0 30px #fff3,0 0 75px #4aa3ff44;letter-spacing:-2px}
.pack-player.premium{background:linear-gradient(90deg,#fff3b1,#fff,#ffd23f,#fff5a8);-webkit-background-clip:text;color:transparent;text-shadow:none}
.pack-rating{font-size:clamp(72px,14vw,150px);font-weight:950;line-height:.86;color:#fff;text-shadow:0 0 20px #fff6,0 0 55px #4aa3ff66}
.pack-rating.premium{color:#ffd75e;text-shadow:0 0 22px #fff,0 0 55px #ffd23f88}
.pack-statline{margin-top:12px;color:#d5def2;font-size:14px}
.trophy-hero{font-size:118px;filter:drop-shadow(0 0 25px #ffd23f66);animation:trophyFloat 1.6s ease-in-out infinite}
@keyframes trophyFloat{50%{transform:translateY(-12px) rotateY(10deg) scale(1.04)}}
.pack-fireworks{position:absolute;inset:0;pointer-events:none}
.pack-fireworks i{position:absolute;left:50%;top:50%;width:6px;height:18px;border-radius:4px;background:#ffd23f;box-shadow:0 0 12px #fff;transform:translate(-50%,-50%);animation:fireBurst 1.35s cubic-bezier(.1,.8,.2,1) forwards;animation-delay:var(--d)}
@keyframes fireBurst{to{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r));opacity:0}}
.fp-reward-pop{position:fixed;right:24px;top:86px;z-index:10030;padding:10px 14px;border-radius:14px;background:linear-gradient(145deg,#0a2340,#071221);border:1px solid #4aa3ff55;box-shadow:0 12px 34px #0009,0 0 28px #4aa3ff22;animation:rewardIn .55s cubic-bezier(.2,1.3,.3,1) both}

/* ===== CONTRAST REFINEMENT : 어두운 패널 가독성 강화 ===== */
/* 디자인은 유지하고, 어두운 패널의 본문/보조 문구만 한 단계 밝게 조정 */
.match-hud,.rating-live,.mom-wrap,.mini-stat,.player-spotlight,.news-tape,
.shop-hero-main,.shop-fp-bank,.fp-balance-big,.pack-card,.collection-card,
.hot-list .pl,.objective{color:#eef4ff}
.match-hud span,.rating-live span,.mom-wrap small,.mini-stat small,
.player-meta,.news-track span,.objective small,.pack-sub,.pack-note,
.pack-badge,.collection-meta,.shop-hero-main .hero-sub,.shop-fp-bank .pack-note,
.metric-row>span:first-child,.rating-team-title,.rating-pos{color:#b9c8e6!important}
.match-hud b,.rating-live b,.mom-wrap b,.mini-stat b,.player-name,
.news-track b,.objective b,.collection-name,.pack-card .pack-title{color:#f4f8ff}
.match-hud,.rating-live,.mini-stat,.player-spotlight,.news-tape,.pack-card,
.collection-card,.hot-list .pl,.objective{ text-shadow:0 1px 8px #0006 }
.pack-pill{color:#e8effc!important;background:#ffffff12;border-color:#ffffff1c}
.pack-pill.hot{color:#ffeaa3!important}
.shop-kicker{color:#a5efff!important}
.shop-title{filter:drop-shadow(0 0 10px #4aa3ff22)}
.section-top h2{color:#dbe7fb}
.mom-grid small{color:#bdcbea!important}
.mom-list>div:first-child{color:#bdcbea!important}
.currency-chip{color:#e8effc}
.rating-head span{color:#b9c8e6!important}
@media(prefers-color-scheme:dark), (prefers-color-scheme:no-preference){
  h2{color:#cbd8ed}
  th{color:#b9c7df}
  .hero-sub{color:#bccbe4}
}
/* 인라인 var(--mut) 색상도 어두운 프리미엄 영역에서는 충분히 밝게 표시 */
.shop-hero-main [style*="color:var(--mut)"],
.shop-fp-bank [style*="color:var(--mut)"],
.pack-card [style*="color:var(--mut)"],
.collection-card [style*="color:var(--mut)"],
.match-hud [style*="color:var(--mut)"],
.rating-live [style*="color:var(--mut)"],
.mom-wrap [style*="color:var(--mut)"],
.objective [style*="color:var(--mut)"]{color:#b9c8e6!important}
/* 포커스 시에도 배경과 텍스트가 확실히 분리되도록 */
.dark-contrast-text{color:#f1f6ff!important}

/* ===== NATURAL CONTRAST PASS · 유사 명도 영역 정리 ===== */
:root{--mut2:#a9b9d6;--mut3:#7f93b8}
/* 가장 문제가 되기 쉬운 어두운 서브패널: 배경을 한 단계 낮추고 텍스트를 한 단계 올림 */
.mini-stat{background:linear-gradient(180deg,#08111fdd,#060d18ee);border-color:#ffffff16}
.mini-stat small,.pack-note,.pack-sub,.collection-meta,.rating-team-title,.rating-pos,.player-meta,.news-track span{color:var(--mut2)!important}
.news-tape{background:linear-gradient(180deg,#07101d,#050b15);border-color:#ffffff16}
.player-spotlight{background:radial-gradient(circle at 0 0,#ffd23f18,transparent 45%),linear-gradient(180deg,#0b1627,#07101d);border-color:#ffd23f2e}
.objective{background:linear-gradient(90deg,#0b1724,#0a1422);border-color:#38e08c28}
.metric-track{background:#050b15;border-color:#ffffff14}
.hot-list .pl{background:#08111dcc;border-color:#ffffff12}
.pack-badge{background:#040913e8;border-color:#ffffff24;color:#a9b9d6}
.collection-card{background:linear-gradient(180deg,#08111f,#060c17);border-color:#ffffff16}
.hero-sub{color:var(--mut2)}
.orb-vs{color:#9fb0cf}
/* FP 상점의 보조 문구는 배경과 충분히 분리되되 과하게 하얗지 않게 */
.shop-hero .hero-sub,.shop-fp-bank .pack-note{color:#aebddd!important}
/* 경계선도 배경과 너무 비슷하지 않게 1단계 강화 */

/* ===== 3-TIER PLAYER CARD SYSTEM ===== */

nt(145deg,#11243b,#08111d 70%)}.tier-card.l3{border-color:#ffd23f88;background:radial-gradient(circle at 85% 10%,#ffd23f2a,transparent 46%),radial-gradient(circle at 10% 90%,#ff9d0015,transparent 44%),linear-gradient(145deg,#2c210b,#0d0a05 75%);box-shadow:0 0 22px #ffd23f18,0 10px 30px #0007}.tier-card .tl{font-size:9px;letter-spacing:1.5px;font-weight:900}.tier-card .tn{font-size:17px;font-weight:950;margin-top:7px}.tier-card .to{font-size:38px;line-height:.95;font-weight:950;margin-top:7px}.tier-card .ts{font-size:10px;color:#c6d0e2;margin-top:8px}.tier-card .tcost{margin-top:10px;font-size:10px;font-weight:800}.tier-card.l2 .tl,.tier-card.l2 .to{color:#8fe9ff}.tier-card.l3 .tl,.tier-card.l3 .to{color:#ffe38a;text-shadow:0 0 16px #ffd23f38}@keyframes tierShine{to{transform:translateX(160%) rotate(10deg)}}

/* ===== THEME SWITCH · WHITE / DARK ===== */
#header-tools{display:flex;align-items:center;gap:8px;justify-content:flex-end}
#themeToggle{min-width:108px;height:36px;padding:4px 8px;border-radius:999px;font-weight:800;font-size:12px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:background .25s ease,border-color .25s ease,transform .15s ease,box-shadow .25s ease}
#themeToggle:hover{transform:translateY(-1px)}
#themeToggle .toggle-track{position:relative;width:52px;height:24px;border-radius:999px;display:block;flex:0 0 auto;border:1px solid transparent;box-shadow:inset 0 2px 5px #0002}
#themeToggle .toggle-thumb{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;display:block;background:#fff;box-shadow:0 2px 6px #0005;transition:transform .25s cubic-bezier(.2,.8,.2,1),background .25s ease}
#themeToggle .toggle-label{min-width:28px;text-align:left;line-height:1}
:root[data-theme="dark"] #themeToggle{background:linear-gradient(135deg,#101d35,#0a1527)!important;color:#d9e8ff!important;border-color:#33577f!important;box-shadow:0 0 0 1px #4aa3ff12 inset,0 5px 16px #0005}

:root[data-theme="dark"] #themeToggle .toggle-thumb{transform:translateX(28px);background:#dff4ff;box-shadow:0 0 10px #4aa3ff88,0 2px 7px #0005}
:root[data-theme="light"] #themeToggle{background:linear-gradient(135deg,#ffffff,#eaf1fb)!important;color:#183456!important;border-color:#b4c8e5!important;box-shadow:0 4px 14px #8aa0bd35}
:root[data-theme="light"] #themeToggle .toggle-track{background:linear-gradient(90deg,#ffd75a,#f5b938);border-color:#e0b545}
:root[data-theme="light"] #themeToggle .toggle-thumb{transform:translateX(0);background:#fffdf2;box-shadow:0 0 10px #ffd23f88,0 2px 7px #0004}

html[data-theme="light"] .dark-contrast-text{color:#183451!important}

@media(max-width:700px){#header-tools{width:100%;justify-content:space-between}#themeToggle{min-width:88px}}

/* ===== CINEMATIC PREMIUM CSS FX — palette preserved ===== */
:root{--fx-white:#ffffff;--fx-black:#000000}
html{scroll-behavior:smooth}
body{position:relative;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.24;background:linear-gradient(transparent 0 49%,#ffffff04 50% 51%,transparent 52%),radial-gradient(500px 280px at var(--gx,50%) var(--gy,10%),#ffffff08,transparent 70%);background-size:100% 6px,100% 100%;mix-blend-mode:screen}
#app{position:relative;z-index:1}
#app:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(circle at 15% 15%,#38e08c10,transparent 24%),radial-gradient(circle at 85% 10%,#4aa3ff10,transparent 25%),radial-gradient(circle at 50% 100%,#ffd23f08,transparent 26%);animation:ambientDrift 14s ease-in-out infinite alternate}
@keyframes ambientDrift{0%{filter:hue-rotate(0deg);transform:scale(1)}50%{transform:scale(1.018)}100%{filter:hue-rotate(8deg);transform:scale(1.035)}}

header{position:relative;padding:8px 10px;border:1px solid #ffffff0d;border-radius:16px;background:linear-gradient(180deg,#ffffff06,#00000008);box-shadow:0 12px 40px #0003,0 0 0 1px #ffffff05 inset;backdrop-filter:blur(10px)}
header:after{content:"";position:absolute;left:4%;right:4%;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--ac2),var(--ac),transparent);filter:blur(.2px);opacity:.8;animation:headerLine 3.4s ease-in-out infinite}
@keyframes headerLine{0%,100%{opacity:.35;transform:scaleX(.65)}50%{opacity:1;transform:scaleX(1)}}
header h1{position:relative;text-shadow:0 0 16px #38e08c20,0 0 30px #4aa3ff16}
header h1:after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:2px;background:linear-gradient(90deg,transparent,var(--ac),var(--ac2),transparent);background-size:200% 100%;animation:logoSweep 2.8s linear infinite;opacity:.6}
@keyframes logoSweep{to{background-position:200% 0}}

nav{position:relative;padding:4px;border-radius:14px;background:linear-gradient(180deg,#ffffff05,#00000012);border:1px solid #ffffff08;box-shadow:0 10px 30px #0002;backdrop-filter:blur(8px)}
nav button{position:relative;border-color:transparent!important;background:transparent!important;isolation:isolate;transition:transform .18s ease,color .18s ease,filter .18s ease}
nav button:before{content:"";position:absolute;inset:2px;border-radius:9px;background:linear-gradient(135deg,#ffffff09,transparent 40%,#ffffff04);opacity:0;transition:opacity .18s ease;z-index:-1}
nav button:after{content:"";position:absolute;left:14%;right:14%;bottom:3px;height:2px;border-radius:10px;background:linear-gradient(90deg,transparent,var(--ac),var(--ac2),transparent);transform:scaleX(0);transition:transform .22s ease;box-shadow:0 0 10px var(--ac2)}
nav button:hover{transform:translateY(-1px);filter:brightness(1.06)}
nav button:hover:before{opacity:1}
nav button.on:after{transform:scaleX(1)}
nav button.on{text-shadow:0 0 14px #ffffff26}

.card,.tc,.pl,.tier-card,.premium-card,.shop-hero,.collection-card,.player-spotlight,.objective,.mini-stat,.news-tape,.rating-live,.mom-wrap,.currency-chip,.fp{transform-style:preserve-3d;backface-visibility:hidden;will-change:transform,box-shadow}
.card{box-shadow:0 10px 30px #0004,0 1px 0 #ffffff0a inset;transition:transform .24s cubic-bezier(.2,.8,.2,1),box-shadow .28s ease,border-color .25s ease,filter .25s ease}
.card:before,.tc:before,.tier-card:before,.premium-card:before,.shop-hero:before,.collection-card:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(260px 180px at var(--mx,50%) var(--my,50%),#ffffff0d,transparent 68%);opacity:.7;transition:opacity .25s ease}
.card:hover,.tc:hover,.tier-card:hover,.premium-card:hover,.shop-hero:hover,.collection-card:hover{box-shadow:0 18px 44px #0006,0 0 0 1px #ffffff0a inset,0 0 22px #4aa3ff0d;filter:saturate(1.04)}
.card:hover:before,.tc:hover:before,.tier-card:hover:before,.premium-card:hover:before,.shop-hero:hover:before,.collection-card:hover:before{opacity:1}
.card:after{background:linear-gradient(110deg,transparent 25%,#ffffff12 40%,#ffffff26 50%,transparent 62%);filter:blur(.2px)}

button{box-shadow:0 4px 14px #0002,0 1px 0 #ffffff0d inset;transition:transform .14s ease,box-shadow .24s ease,border-color .2s ease,filter .2s ease}
button:before{content:"";position:absolute;inset:-2px;pointer-events:none;border-radius:inherit;background:linear-gradient(100deg,transparent 20%,#ffffff22 45%,transparent 60%);transform:translateX(-120%);transition:transform .65s ease}
button:hover{box-shadow:0 8px 20px #0004,0 0 16px #4aa3ff12;filter:brightness(1.04)}
button:hover:before{transform:translateX(120%)}
button:active{filter:brightness(.96)}
.big{box-shadow:0 10px 30px #2a7de055,0 0 0 1px #ffffff10 inset,0 0 28px #38e08c18;overflow:hidden}
.big:after{content:"";position:absolute;inset:-30%;background:conic-gradient(from 0deg,transparent,#ffffff14,transparent 22%,transparent 68%,#ffffff10,transparent);animation:buttonOrbit 3.8s linear infinite}
@keyframes buttonOrbit{to{transform:rotate(360deg)}}

.teams .tc{overflow:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s ease,filter .28s ease}
.teams .tc:hover{transform:translateY(-5px) scale(1.012);box-shadow:0 20px 42px #0006,0 0 24px #4aa3ff12}
.teams .tc:after{content:"";position:absolute;top:-40%;left:-25%;width:22%;height:180%;background:linear-gradient(90deg,transparent,#ffffff20,transparent);transform:rotate(18deg) translateX(-220%);animation:teamSheen 5s ease-in-out infinite}
@keyframes teamSheen{0%,72%,100%{transform:rotate(18deg) translateX(-220%)}82%{transform:rotate(18deg) translateX(650%)}}

.tier-card{overflow:hidden}
.tier-card:after{content:"";position:absolute;inset:-40%;background:conic-gradient(from 180deg,transparent,var(--ac)10%,transparent 20%,transparent 62%,var(--ac2)74%,transparent 84%);opacity:.22;filter:blur(18px);animation:tierAura 8s linear infinite;pointer-events:none}
@keyframes tierAura{to{transform:rotate(360deg)}}
.tier-card.l3:after{background:conic-gradient(from 180deg,transparent,#ffd23f20 10%,transparent 22%,transparent 58%,#ffd23f42 74%,transparent 86%);opacity:.35;animation-duration:6s}

.pl{overflow:hidden}
.pl:after{content:"";position:absolute;top:-30%;bottom:-30%;left:-24%;width:16%;background:linear-gradient(90deg,transparent,#ffffff13,transparent);transform:skewX(-18deg) translateX(-300%);transition:transform .7s ease}
.pl:hover:after{transform:skewX(-18deg) translateX(900%)}
.pl.sel{box-shadow:0 0 0 1px #38e08c33 inset,0 0 24px #38e08c18!important}

.bar{overflow:hidden;border-radius:999px;box-shadow:inset 0 0 0 1px #ffffff0a,0 2px 10px #0002}
.bar i{overflow:hidden;border-radius:inherit}
.bar i:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#ffffff22 46%,transparent 55%);transform:translateX(-130%);animation:barFlash 2.4s linear infinite}
@keyframes barFlash{to{transform:translateX(150%)}}

.currency-chip,.fp{position:relative;overflow:hidden;box-shadow:0 8px 22px #0003,0 0 0 1px #ffffff08 inset}
.currency-chip:after,.fp:after{content:"";position:absolute;top:-80%;bottom:-80%;left:-28%;width:22%;background:linear-gradient(90deg,transparent,#ffffff42,transparent);transform:rotate(18deg) translateX(-220%);animation:currencySweep 4.5s ease-in-out infinite}
@keyframes currencySweep{0%,62%,100%{transform:rotate(18deg) translateX(-220%)}74%{transform:rotate(18deg) translateX(620%)}}

.shop-hero{overflow:hidden}
.shop-hero:after{content:"";position:absolute;inset:-1px;border-radius:inherit;background:linear-gradient(120deg,transparent 28%,#ffffff10 44%,#ffffff18 50%,transparent 62%);background-size:240% 100%;animation:heroGloss 5.8s linear infinite;pointer-events:none}
@keyframes heroGloss{to{background-position:-240% 0}}

.match-hud,.rating-live{box-shadow:0 8px 26px #0004,0 0 0 1px #ffffff06 inset}
.match-hud:after,.rating-live:after{content:"";position:absolute;inset:0;background:radial-gradient(320px 130px at var(--mx,50%) var(--my,50%),#ffffff08,transparent 68%);pointer-events:none}
.score-live{filter:drop-shadow(0 0 8px #38e08c22)}

.mom-wrap{position:relative;overflow:hidden;box-shadow:0 0 0 1px #ffd23f18 inset,0 16px 36px #0005,0 0 40px #ffd23f12}
.mom-wrap:after{content:"";position:absolute;top:-30%;bottom:-30%;left:-20%;width:12%;background:linear-gradient(90deg,transparent,#fff8,#ffd23f55,transparent);transform:skewX(-15deg) translateX(-400%);animation:momGoldSweep 3.6s ease-in-out infinite}
@keyframes momGoldSweep{0%,55%,100%{transform:skewX(-15deg) translateX(-400%)}70%{transform:skewX(-15deg) translateX(1000%)}}
.mom-badge{filter:drop-shadow(0 0 12px #ffd23f44);animation:badgeFloat 2.2s ease-in-out infinite}
@keyframes badgeFloat{50%{transform:translateY(-2px) scale(1.015)}}
.mom-rating{animation:momPulse 1.8s ease-in-out infinite}
@keyframes momPulse{50%{text-shadow:0 0 30px #38e08c88,0 0 60px #ffd23f26;transform:scale(1.025)}}

#log div{position:relative;overflow:hidden}
#log div:after{content:"";position:absolute;left:-20%;top:0;bottom:0;width:18%;background:linear-gradient(90deg,transparent,#ffffff10,transparent);transform:translateX(-300%);animation:logSweep 2.8s ease-in-out infinite}
@keyframes logSweep{0%,70%,100%{transform:translateX(-300%)}82%{transform:translateX(900%)}}

::selection{background:#38e08c55;color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--ac2),var(--ac));border-radius:999px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{filter:brightness(1.15)}

/* cinematic entrance without changing palette */
main>*{animation:cinematicIn .55s cubic-bezier(.2,.8,.2,1) both}
main>*:nth-child(2){animation-delay:.05s}
main>*:nth-child(3){animation-delay:.09s}
@keyframes cinematicIn{from{opacity:0;transform:translateY(10px) scale(.985);filter:blur(4px)}to{opacity:1;transform:none;filter:blur(0)}}

@media(max-width:700px){header{border-radius:14px}.card,.tc,.tier-card,.premium-card,.shop-hero{border-radius:13px}.teams .tc:hover{transform:translateY(-3px) scale(1.008)}}
@media(prefers-reduced-motion:reduce){body:before,#app:before,header:after,header h1:after,.big:after,.teams .tc:after,.tier-card:after,.currency-chip:after,.fp:after,.shop-hero:after,.mom-wrap:after,#log div:after{animation:none!important}.card,.tc,.tier-card,.premium-card,.shop-hero{transform:none!important}.pl:after{display:none}}


/* ===== LIVE COMMENTARY UPGRADE ===== */
.live-commentary{position:relative;margin:12px 0;padding:0;border:1px solid color-mix(in srgb,var(--ac2) 26%,transparent);border-radius:14px;background:linear-gradient(145deg,color-mix(in srgb,var(--card) 92%,#0b1630),color-mix(in srgb,var(--card) 84%,#06101f));box-shadow:inset 0 1px 0 #ffffff10,0 12px 34px #0004;overflow:hidden}
.live-commentary:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 20%,#ffffff08 45%,transparent 70%);transform:translateX(-120%);animation:commentarySweep 3.4s linear infinite}
@keyframes commentarySweep{to{transform:translateX(120%)}}
.commentary-head{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;border-bottom:1px solid #ffffff10;background:linear-gradient(90deg,#0004,transparent,#0004);font-size:13px}
.commentary-head>div{display:flex;align-items:center;gap:8px}.commentary-dot{width:8px;height:8px;border-radius:50%;background:#ff5d6c;box-shadow:0 0 12px #ff5d6c;animation:commentaryPulse 1s ease-in-out infinite}.commentary-live{font-size:10px;letter-spacing:1.4px;font-weight:900;color:#ff7a87}
@keyframes commentaryPulse{50%{transform:scale(1.4);opacity:.6}}
.commentary-log{max-height:220px;overflow:auto;padding:9px 11px;font-size:13px;line-height:1.65;scroll-behavior:smooth}.commentary-log::-webkit-scrollbar{width:6px}.commentary-log::-webkit-scrollbar-thumb{background:#ffffff18;border-radius:99px}
.commentary-log>div{padding:7px 9px;margin:4px 0;border-left:2px solid color-mix(in srgb,var(--ac2) 55%,transparent);border-radius:8px;background:#ffffff05;animation:commentaryIn .22s ease both}.commentary-log>div:first-child{background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 9%,transparent),transparent);border-left-color:var(--ac);box-shadow:0 0 18px color-mix(in srgb,var(--ac) 10%,transparent)}
@keyframes commentaryIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media(max-width:760px){.commentary-log{max-height:190px;font-size:12px}}

/* ===== MICRO POLISH : 기존 색상/구조 유지 ===== */
#header-tools{display:flex;align-items:center;gap:10px}
#themeToggle{transition:transform .18s ease,box-shadow .22s ease,border-color .22s ease,background .22s ease}
#themeToggle:hover{transform:translateY(-1px);box-shadow:0 6px 18px #0002}
button:not(:disabled){transition:transform .14s ease,box-shadow .2s ease,border-color .2s ease,filter .2s ease}
button:not(:disabled):hover{transform:translateY(-1px);filter:saturate(1.06)}
button:not(:disabled):active{transform:translateY(0) scale(.98)}
.card{transition:box-shadow .22s ease,border-color .22s ease,transform .22s ease}
.card:hover{border-color:color-mix(in srgb,var(--ac2) 42%,var(--line));box-shadow:0 12px 30px #0003}
nav button{transition:background .22s ease,color .22s ease,border-color .22s ease,transform .18s ease}
nav button:hover{transform:translateY(-1px)}
nav button.on{box-shadow:0 7px 18px #2a7de022,0 0 0 1px #ffffff08 inset}
.sb b{transition:text-shadow .25s ease,transform .25s ease}
.sb b:hover{text-shadow:0 0 14px #4aa3ff55}
.ev{transition:background .2s ease,border-color .2s ease}
.ev:hover{background:#ffffff06;border-color:color-mix(in srgb,var(--ac2) 28%,var(--line))}
@media(max-width:700px){#header-tools{gap:6px}#themeToggle{padding:7px 9px;font-size:12px}}

/* ===== PREMIUM PLAYER CARD SYSTEM · PURE CSS ===== */
.player-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px;align-items:stretch}
.player-card-wrap{display:flex;justify-content:center;min-width:0}

/* ===== THREE DISTINCT PLAYER CARD DESIGNS ===== */
.player-card{position:relative;width:min(100%,216px);aspect-ratio:.715;overflow:hidden;border-radius:20px;cursor:pointer;transform-style:preserve-3d;perspective:1200px;border:1px solid #ffffff24;background:#111827;color:#eef4ff;box-shadow:0 16px 36px #0007,0 0 0 1px #ffffff12 inset;transition:transform .32s cubic-bezier(.2,.8,.2,1),box-shadow .32s ease,border-color .28s ease,filter .28s ease;isolation:isolate}
.player-card:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:6;opacity:.75;mix-blend-mode:screen}
.player-card:after{content:"";position:absolute;inset:1px;border-radius:19px;pointer-events:none;z-index:8;background:linear-gradient(140deg,#ffffff1a,transparent 28%,transparent 72%,#0005);opacity:.9}
.player-card:hover{transform:translateY(-6px) scale(1.015)}
.player-card[data-enhanced="1"] .card-enhance{opacity:1;transform:scale(1);animation:enhancePulse 1.7s ease-in-out infinite}
@keyframes enhancePulse{50%{box-shadow:0 0 18px #ffd65caa,0 0 34px #ffd65c44}}

/* LEVEL 1 — TECH SILVER */
.player-card.l1{--ink:#eff7ff;--sub:#b3c7db;--accent:#b9d8ee;--edge:#9aafc4;border-color:#7d9bb6;background:linear-gradient(145deg,#20344f 0%,#0f1d32 48%,#172945 100%);box-shadow:0 18px 38px #0008,0 0 28px #7bc6ff15,0 0 0 1px #eaf7ff16 inset}
.player-card.l1:before{background:linear-gradient(115deg,transparent 18%,#dff7ff18 39%,transparent 52%,#8bbdff0d 68%,transparent 78%);animation:silverSweep 4.5s linear infinite}
@keyframes silverSweep{to{transform:translateX(100%)}}
.player-card.l1:hover{box-shadow:0 24px 46px #0009,0 0 36px #6fc9ff24,0 0 0 1px #c5f1ff33 inset;border-color:#9bdcff}
.player-card.l1 .card-ovr{color:#f5fbff;text-shadow:0 0 10px #91d8ff44}
.player-card.l1 .card-level-badge{color:#d6efff;background:#12365be6;border-color:#76c9ff66}

/* LEVEL 2 — CHAMPION GOLD */
.player-card.l2{--ink:#fff8da;--sub:#efcf77;--accent:#ffd75e;--edge:#e8b835;border-color:#d69d20;background:linear-gradient(145deg,#3a2408 0%,#1d1104 48%,#3a1c05 100%);box-shadow:0 20px 42px #0009,0 0 34px #ffbd3a22,0 0 0 1px #ffe7a52a inset}
.player-card.l2:before{background:linear-gradient(115deg,transparent 22%,#fff2b94c 40%,transparent 55%);transform:translateX(-120%) skewX(-16deg);opacity:.7}
.player-card.l2:hover:before{animation:goldShimmer 1.05s ease-out forwards}
@keyframes goldShimmer{to{transform:translateX(120%) skewX(-16deg)}}
.player-card.l2:hover{box-shadow:0 28px 54px #000b,0 0 48px #ffc23b30,0 0 0 1px #fff0a344 inset;border-color:#ffe18b;filter:saturate(1.12)}
.player-card.l2 .card-ovr{color:#fff7d0;text-shadow:0 0 14px #ffd65d66}
.player-card.l2 .card-level-badge{color:#fff1b3;background:#4c2b08eb;border-color:#ffd75f77}

/* LEVEL 3 — WORLD CLASS AURORA */
.player-card.l3{--ink:#f1ffff;--sub:#b5d7e9;--accent:#7cf7ff;--edge:#8df4ef;border-color:transparent;background:linear-gradient(145deg,#050b17 0%,#10172b 45%,#080e19 100%);box-shadow:0 26px 68px #000b,0 0 42px #55efff1f,0 0 90px #9b63ff18,0 0 0 1px #dfffff13 inset}
.player-card.l3:before{inset:-35%;background:conic-gradient(from 20deg,#55ffe0 0 12%,transparent 20%,#8c63ff 30%,transparent 43%,#46c8ff 56%,transparent 68%,#ff5fd6 80%,transparent 92%,#55ffe0 100%);filter:blur(22px);animation:worldAura 5.8s linear infinite}
@keyframes worldAura{to{transform:rotate(360deg)}}
.player-card.l3:after{background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),#ffffff20,transparent 20%),linear-gradient(120deg,#ffffff1b,transparent 28%,transparent 70%,#74f9ff10);mix-blend-mode:screen}
.player-card.l3:hover{transform:perspective(1200px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-11px) scale(1.035);box-shadow:0 34px 80px #000d,0 0 46px #59efff3a,0 0 96px #9565ff2a,0 0 0 1px #d3ffff3b inset}
.player-card.l3 .card-ovr{text-shadow:0 0 18px #7cf7ffb0}
.player-card.l3 .card-level-badge{color:#d9ffff;background:#071b2ded;border-color:#7cf7ff88;box-shadow:0 0 18px #61efff1d}

.card-top{position:absolute;left:14px;right:14px;top:11px;display:flex;justify-content:space-between;align-items:flex-start;z-index:10}.card-ovr-block{display:flex;flex-direction:column;line-height:1}.card-ovr{font-size:35px;font-weight:950;letter-spacing:-1px}.card-pos{font-size:11px;letter-spacing:2px;margin-top:4px;font-weight:900;color:var(--sub)}
.card-enhance{opacity:0;transform:scale(.9);background:linear-gradient(145deg,#fff6aa,#f0b929);color:#4b3300;border:1px solid #ffe48a;border-radius:9px;padding:5px 8px;font-size:11px;font-weight:950;box-shadow:0 0 0 #0000;transition:.25s}
.card-level-badge{position:absolute;right:14px;top:58px;z-index:10;font-size:9px;font-weight:900;letter-spacing:1.7px;padding:4px 7px;border-radius:999px;background:#ffffff18;border:1px solid #ffffff25;backdrop-filter:blur(8px)}
.card-number{position:absolute;left:14px;right:14px;top:79px;z-index:9;text-align:center;font-size:12px;letter-spacing:5px;font-weight:850;color:var(--sub);opacity:.84}
.card-hero{position:absolute;left:12px;right:12px;top:82px;height:122px;display:flex;align-items:center;justify-content:center;z-index:4;transform:translateZ(34px)}
.card-graphic{position:relative;width:158px;height:115px;border-radius:22px;overflow:hidden;isolation:isolate;transform:translateZ(18px);transition:transform .35s cubic-bezier(.2,.8,.2,1),filter .35s ease}
.player-card.l3:hover .card-graphic{transform:translateZ(30px) scale(1.03);filter:saturate(1.18) brightness(1.08)}
.tier-art{position:absolute;inset:0;overflow:hidden}

/* Silver art */
.art-silver{background:linear-gradient(135deg,#91a8bd 0%,#dce9f4 19%,#5e7792 46%,#d9e8f2 68%,#6c829a 100%);border:1px solid #e2f4ff88;box-shadow:inset 0 0 30px #08203d55,0 0 26px #8ad6ff16}
.art-silver:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,#fff5 0 2px,transparent 2px 10px),linear-gradient(90deg,transparent 24%,#ffffff55 25%,transparent 26%,transparent 74%,#0b234244 75%,transparent 76%);opacity:.65}

  if(!p)return p;

function uniquePackCandidates(){
  // Packs should draw only from available market players, never from the user's already-owned squad.
  // This prevents “pack opened but no new player appeared” caused by pulling an existing player duplicate.
  const norm=n=>String(n||'').normalize('NFC').replace(/\s+/g,'').toLocaleLowerCase('ko-KR');
  const t=G.teams[G.me];
  const owned=new Set([...(t?.pl||[]),...(G.collection||[])].map(p=>norm(p.n)));
  const seen=new Set(),out=[];
  const src=(G.mk||[]).filter(p=>p&&p.n&&!owned.has(norm(p.n))).slice();
  src.sort((a,b)=>(Number(b.ovr)||0)-(Number(a.ovr)||0)||String(a.n).localeCompare(String(b.n),'ko'));
  for(const p of src){const key=norm(p.n);if(!key||seen.has(key))continue;seen.add(key);out.push({...p});}
  return out;
}
function premiumPool(){
  const all=uniquePackCandidates();
  // 게임 내 현재 선수 데이터에서 정확히 281명으로 구성. OVR 90+ 대박 카드가 포함되도록 고OVR 우선.
  return all.slice(0,281);
}
function weightedPick(arr,isPremium){
  if(!arr.length)return null;
  const weights=arr.map(p=>isPremium?(p.ovr>=90?35:1):(p.ovr>=90?5:1));
  const total=weights.reduce((a,b)=>a+b,0);let r=Math.random()*total;
  for(let i=0;i<arr.length;i++){r-=weights[i];if(r<=0)return arr[i];}
  return arr[arr.length-1];
}
function clonePackPlayer(p,tier=1){const base=p.baseOvr??p.ovr;return applyCardTier({n:p.n,pos:p.pos,ovr:base,baseOvr:base,club:p.club||'WORLD CLASS',v:p.v||pv(base),cardTier:tier,cardType:tier,grade:tier,lv:0,mom:0,g:0,out:0,cardId:p.cardId,famous:p.famous});}
function addPackedPlayer(p,tier=getCardTier(p)){
  const t=G.teams[G.me];
  // Preserve the rolled tier; previously clonePackPlayer(p) silently defaulted every pack card to L1.
  const card=clonePackPlayer(p,tier);
  card.cardId=card.cardId||('PACK-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7));
  const norm=n=>String(n||'').normalize('NFC').replace(/\s+/g,'').toLocaleLowerCase('ko-KR');
  // A pulled player is no longer an available market listing.
  const marketIndex=(G.mk||[]).findIndex(x=>norm(x.n)===norm(card.n));
  if(marketIndex>=0)G.mk.splice(marketIndex,1);
  if(t.pl.length<24){t.pl.push(card);normalizePlayerCard(t.pl[t.pl.length-1]);save();return {stored:false,card};}
  G.collection=Array.isArray(G.collection)?G.collection:[];
  G.collection.unshift(card);save();return {stored:true,card};
}

/* ===== Advanced interaction effects (performance optimized) ===== */
(function(){
  const motionQuery = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  document.addEventListener('click', function(e){
    if (motionQuery && motionQuery.matches) return;
    const b = e.target && e.target.closest ? e.target.closest('button') : null;
    if (!b) return;
    const r = b.getBoundingClientRect();
    const x = Number.isFinite(e.clientX) && e.clientX ? e.clientX : r.left + r.width / 2;
    const y = Number.isFinite(e.clientY) && e.clientY ? e.clientY : r.top + r.height / 2;
    const q = document.createElement('span');
    q.className = 'fx-ripple'; q.style.left = x + 'px'; q.style.top = y + 'px';
    document.body.appendChild(q);
    setTimeout(() => q.remove(), 700);
  }, { passive: true });

  function bindTilt(el){
    if (el.dataset.tiltBound) return;
    el.dataset.tiltBound = '1';
    el.addEventListener('pointermove', function(e){
      if ((motionQuery && motionQuery.matches) || e.pointerType === 'touch') return;
      const r = el.getBoundingClientRect();
      if (!r.width || !r.height) return;
      const x = (e.clientX - r.left) / r.width - .5;
      const y = (e.clientY - r.top) / r.height - .5;
      el.style.transform = `perspective(900px) rotateX(${(-y*3).toFixed(2)}deg) rotateY(${(x*3).toFixed(2)}deg) translateY(-2px)`;
    }, { passive: true });
    el.addEventListener('pointerleave', function(){ el.style.transform = ''; }, { passive: true });
  }

  // Rebind newly rendered premium/team cards at most once per frame.
  let enhanceQueued = false;
  function enhanceCards(){
    enhanceQueued = false;
    document.querySelectorAll('.premium-card,.tc').forEach(bindTilt);
  }
  const obs = new MutationObserver(function(){
    if (enhanceQueued) return;
    enhanceQueued = true;
    requestAnimationFrame(enhanceCards);
  });
  obs.observe(document.body, { childList: true, subtree: true });
  document.querySelectorAll('.premium-card,.tc').forEach(bindTilt);

  // One delegated pointer listener updates only the currently hovered element.
  // No full-page queries or layout reads for every card on every pointer event.
  const hotSelector = '.card,.tc,.tier-card,.premium-card,.shop-hero,.collection-card,.player-spotlight,.objective,.mini-stat,.news-tape,.rating-live,.mom-wrap,.currency-chip,.fp';
  let hotTarget = null, pointerX = 0, pointerY = 0, pointerQueued = false;
  document.addEventListener('pointermove', function(e){
    if ((motionQuery && motionQuery.matches) || e.pointerType === 'touch') return;
    const t = e.target;
    hotTarget = t && t.closest ? t.closest(hotSelector) : null;
    if (!hotTarget) return;
    pointerX = e.clientX; pointerY = e.clientY;
    if (pointerQueued) return;
    pointerQueued = true;
    requestAnimationFrame(function(){
      pointerQueued = false;
      const el = hotTarget;
      if (!el || !el.isConnected) return;
      const r = el.getBoundingClientRect();
      if (!r.width || !r.height) return;
      el.style.setProperty('--mx', (((pointerX-r.left)/r.width)*100).toFixed(1)+'%');
      el.style.setProperty('--my', (((pointerY-r.top)/r.height)*100).toFixed(1)+'%');
    });
  }, { passive: true });
})();

/* ===== THEME SWITCH LOGIC ===== */
(function(){
  let saved='dark';
  try{saved=localStorage.getItem('pm_theme')||'dark'}catch(e){}
  if(saved!=='light' && saved!=='dark') saved='dark';
  document.documentElement.setAttribute('data-theme',saved);
  window.updateThemeButton=function(){
    const b=document.getElementById('themeToggle');
    if(!b)return;
    const dark=document.documentElement.getAttribute('data-theme')!=='light';
    const label=b.querySelector('.toggle-label');
    if(label)label.textContent=dark?'다크':'화이트';
    b.setAttribute('aria-checked',dark?'true':'false');
    b.setAttribute('aria-label',dark?'다크 모드 사용 중 — 화이트 모드로 전환':'화이트 모드 사용 중 — 다크 모드로 전환');
  };
  window.toggleTheme=function(){
    const next=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
    document.documentElement.setAttribute('data-theme',next);
    try{localStorage.setItem('pm_theme',next)}catch(e){}
    updateThemeButton();
    document.body.animate([{filter:'brightness(.96)'},{filter:'brightness(1)'}],{duration:180,easing:'ease-out'});
  };
  document.addEventListener('DOMContentLoaded',updateThemeButton);
  updateThemeButton();
})();
